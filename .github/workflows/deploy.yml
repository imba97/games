name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 部署到 GitHub Pages 所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，且不打断正在进行的生产部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # pnpm-lock.yaml 已是 v9 格式，需要 pnpm 9 及以上才能用 --frozen-lockfile 安装
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # 构建必须早于类型检查：`unplugin-auto-import` 在 `vite build` 期间才写出
      # auto-import/auto-import.d.ts，该文件是 git-ignored 的，不先构建的话全局 API 解析不到
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # GitHub Pages 没有服务端重写，用 404.html 兜底，
      # 这样直接访问 /MemoryGame 这类子路由时也能加载应用并正确渲染
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
